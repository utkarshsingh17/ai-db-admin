services:
  - type: web
    name: db-admin-assisstant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      # No SPRING_PROFILES_ACTIVE here on purpose — the dev profile has convenience fallbacks for
      # local Postgres and must never be active in a real deployment. See application.yaml.
      #
      # Postgres is external (not a Render-managed database) — fill these in from your provider's
      # connection string, e.g. Neon: postgresql://<user>:<password>@<host>/<db>?sslmode=require
      # becomes DB_ADMIN_DATASOURCE_URL=jdbc:postgresql://<host>:5432/<db>?sslmode=require plus the
      # username/password as their own vars. All four are secrets — never commit real values here.
      - key: DB_ADMIN_DATASOURCE_URL
        sync: false
      - key: DB_ADMIN_DATASOURCE_USERNAME
        sync: false
      - key: DB_ADMIN_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
